name: Pipeline CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: '*/5 * * * *'

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Executar testes
        run: npm test